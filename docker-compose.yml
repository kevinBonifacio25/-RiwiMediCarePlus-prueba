services:
  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: riwi_medicare
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: secret_key
      JWT_EXPIRES_IN: 1d
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - medicare-network

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: riwi_medicare
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432" # Optional: allows connecting from your host machine (e.g. pgAdmin/DBeaver)
    volumes:
      - postgres_data:/var/lib/postgresql/data
      
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d riwi_medicare"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - medicare-network

volumes:
  postgres_data:

networks:
  medicare-network:
    driver: bridge
